[build]
  command = "bun run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Runtime v3 detects `next export`, not Next.js's `output: "export"`.
  # This site needs no serverless runtime.
  NEXT_PLUGIN_FORCE_RUN = "false"

[[redirects]]
  from = "/work"
  to = "/#doors"
  status = 301

[[redirects]]
  from = "/standing-agents"
  to = "/custom"
  status = 301

[[redirects]]
  from = "/og.png"
  to = "/opengraph-image"
  status = 301

[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
